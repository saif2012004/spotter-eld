services:
  - type: web
    name: spotter-eld-backend
    runtime: python
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn trip_planner.wsgi --log-file -
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: ""          # set to your Vercel frontend URL after first deploy
      - key: PYTHON_VERSION
        value: "3.12.3"
